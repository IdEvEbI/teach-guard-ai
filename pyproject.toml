[project]
name = "teach-guard-ai"
version = "0.1.0"
description = "Teaching Guard AI assistant: inspect lesson videos and generate reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "typer>=0.16.0",
]

[project.scripts]
teach-guard = "teach_guard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teach_guard"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
