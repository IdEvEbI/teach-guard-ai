[project]
name = "teach-guard-ai"
version = "0.1.0"
description = "Teaching Guard AI assistant: inspect lesson videos and generate reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "typer>=0.16.0",
]

[project.scripts]
teach-guard = "teach_guard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teach_guard"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "no_stub_transcribe: 不 stub transcribe_audio，用于测试转写失败路径",
    "no_stub_punctuate: 不 stub punctuate_transcript，用于测试标点失败路径",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
asr = [
    "mlx-whisper>=0.4.0",
    "httpx[socks]>=0.28.0",
]
